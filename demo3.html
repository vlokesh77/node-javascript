<button onClick="alert('Hello Javascript!')">Click Me</button>
<html>
  <head>
    <title>JavaScript Demo</title>
    <script>
        function showMessage() {
            alert('Hello Javascript!');
        }
    </script>
  </head>
  <body>
    <h1>Welcome to JavaScript!</h1>
    <button onClick="showMessage()">Click Me</button>
  </body>
</html>
